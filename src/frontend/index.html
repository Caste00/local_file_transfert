<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Local File Transfer</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>File Transfer</h1>

	<section>
		<h2>Upload</h2>
		<form id="uploadForm">
			<input type="file" id="fileInput" multiple>
			<button type="submit">Upload file</button>
		</form>
	</section>

	<section>
		<h2>Available files</h2>
		<ul id="fileList"></ul>
	</section>
	
	<script src="app.js"></script>
</body>
</html>
